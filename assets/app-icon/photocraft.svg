<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Iris Photo app icon: a photo (mountains and sun) between crop marks, the same drawing the Iris
    Workspace shows (Iris/src/shared/types/workspace.types.ts, entry irisphoto, hue 205, light 0.66,
    drift 42). The gradient is its oklch(0.66 0.2 205) → oklch(0.60 0.21 247) in sRGB, so every
    renderer draws the same colours. The Workspace draws it on a 64 grid with the tile at 4..60;
    here the tile fills the 512 canvas edge to edge (packaging/icons.sh adds Apple's margin for
    macOS). Every PNG, .ico and .icns in this folder is rendered from this file.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00b1cc"/>
      <stop offset="1" stop-color="#0083f4"/>
    </linearGradient>
  </defs>
  <g transform="scale(9.142857) translate(-4 -4)">
    <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#g)"/>
    <rect x="13" y="17" width="38" height="30" rx="4" fill="#fff" fill-opacity=".95"/>
    <circle cx="41" cy="25.5" r="3.8" fill="url(#g)"/>
    <path d="M15.5 44.5 25.5 31l6.8 8.2 4.9-5.3 11.3 10.6z" fill="url(#g)" fill-opacity=".85"/>
    <path d="M9 20v-8h8M55 44v8h-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
